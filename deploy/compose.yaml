# SP v4 PoC — Phase 2 topology (all on this Mac, Docker)
#
#   browser -> https://localhost (agent: Apache 2.4 + mod_shib4, 172.30.0.20) -> app (Jetty 12, :8081)
#                      \-> https://hub.localtest:8443 (hub: IdP 5.2.3 + shibd plugins), basic auth + IP check
#                                 \-> Google OIDC
#
# Agent authenticates to the hub with agentID + shared secret over TLS (hub's
# self-signed cert exported into the hub-tls volume). Run ./gen-agent-secret.sh once.

services:
  hub:
    build: ./hub
    image: sp4-hub:dev          # same tag whether built by compose or `docker build -t`
    container_name: sp4-hub
    hostname: hub.localtest
    environment:
      # Google OAuth client (Phase 0) and agent secret (Phase 2). Values live in deploy/.env (gitignored).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set in deploy/.env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set in deploy/.env}
      AGENT_SECRET: ${AGENT_SECRET:?run ./gen-agent-secret.sh}
    networks:
      poc:
        ipv4_address: 172.30.0.10
        aliases: [hub.localtest]   # must match the CN/SAN of credentials/idp-userfacing.p12
    ports:
      - "127.0.0.1:8080:8080"   # for poking at the hub from the Mac; agent uses TLS on 8443 via the docker net
    volumes:
      - hub-logs:/opt/shibboleth-idp/logs
      - hub-tls:/tls-export      # entrypoint writes hub.crt here for the agent
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/idp/status"]
      interval: 15s
      timeout: 5s
      retries: 20

  agent:
    build: ./agent
    image: sp4-agent:dev
    container_name: sp4-agent
    depends_on:
      hub:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      poc:
        ipv4_address: 172.30.0.20   # pinned: the hub's allowedAddressRanges is this /32
    ports:
      - "443:443"
      - "80:80"
    volumes:
      # Directory mounts (not single files): editing a file on the Mac replaces its
      # inode, which silently breaks a single-file bind mount.
      - ./agent/conf/shibboleth-sp:/etc/shibboleth-sp:ro
      - ./agent/conf/httpd:/etc/httpd/conf.d/poc:ro
      - agent-sessions:/var/cache/shibboleth-sp
      - hub-tls:/etc/pki/sp4-hub:ro   # hub.crt -> agent.ini tlsCAFile

  app:
    build: ./app
    image: sp4-app:dev
    container_name: sp4-app
    # No published port: only the agent can reach it. That is the "loopback only"
    # rule from the outline, expressed in Docker terms.
    networks:
      poc:
        ipv4_address: 172.30.0.30
    environment:
      # Phase 3b: service-account key -> Google ID token for API_AUDIENCE -> API_URL
      SA_KEY_FILE: /var/lib/jetty/secrets/sa.json
      API_AUDIENCE: https://sp4-poc-api.localtest
      API_URL: http://localhost:8081/api/echo
    command: ["--module=ee10-deploy,ee10-jsp,ee10-annotations,http", "jetty.http.port=8081"]
    volumes:
      - ./app/secrets:/var/lib/jetty/secrets:ro   # service-account key (gitignored)

networks:
  poc:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  hub-logs:
  hub-tls:
  agent-sessions:
