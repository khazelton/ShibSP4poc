# SP v4 Agent config for the PoC. Bind-mounted over /etc/shibboleth-sp/agent.ini.
# Shipped default kept in the image as agent.ini.dist.

[logging]
defaultLevel = INFO

[logging-categories]
# Verbose for the first runs; drop back to INFO once the flow works.
Shibboleth.RemotingService = DEBUG
Shibboleth.Apache = DEBUG
#Shibboleth.RequestMapper = DEBUG
#Shibboleth.libcurl = DEBUG

[remoting]
# Phase 1: plain HTTP to the hub container, no agent secret.
# Phase 2: baseURL -> https://, authMethod = basic, tlsCAFile, secretFile.
agentID = localhost
baseURL = http://hub:8080/idp/profile/sp/
authMethod = none
#authCachingCookie = __Host-JSESSIONID
#tlsCAFile =
#secretSourceType = File
#secretFile = agent.pwd

[session-cache]
type = filesystem

[request-mapper]
path = request-map.xml
reloadChanges = true

# Attributes are exported as server/env variables (default). Apache turns them
# into X-Shib-* headers for the proxy hop; see conf/shib4-poc.conf.
#[attribute-settings]
#[attribute-mappings]
