# SP v4 Agent config for the PoC (Phase 2: networked hub, TLS, shared secret).
# Bind-mounted over /etc/shibboleth-sp/agent.ini. Shipped default kept in the image
# at /etc/shibboleth-sp.shipped/agent.ini.

[logging]
defaultLevel = INFO

[logging-categories]
# Verbose for the first runs; drop back to INFO once the flow works.
Shibboleth.RemotingService = DEBUG
Shibboleth.Apache = DEBUG
#Shibboleth.RequestMapper = DEBUG
#Shibboleth.libcurl = DEBUG

[remoting]
# agentID is the identity the hub knows us by (conf/sp/agents.xml bean id). With
# the hub's credentials map keyed by null it doubles as the basic-auth username;
# the secret itself is delivered separately (agent.pwd, from ./gen-agent-secret.sh).
agentID = sp4-agent.localtest
baseURL = https://hub.localtest:8443/idp/profile/sp/
authMethod = basic
# Hub's self-signed cert, exported by the hub container into a shared volume.
tlsCAFile = /etc/pki/sp4-hub/hub.crt
secretSourceType = File
secretFile = /etc/shibboleth-sp/agent.pwd
#authCachingCookie = __Host-JSESSIONID

[session-cache]
type = filesystem
# /etc/shibboleth-sp is a read-only mount; sessions go to a named volume.
cacheDirectory = /var/cache/shibboleth-sp

[request-mapper]
path = request-map.xml
reloadChanges = true

# Attributes are exported as server/env variables (default). Apache turns them
# into X-Shib-* headers for the proxy hop; see conf/httpd/shib4-poc.conf.
#[attribute-settings]
#[attribute-mappings]
